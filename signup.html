<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10291f"><title>Create your account — ViewFaucet</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body data-page="signup" data-access="guest"><header class="pub-head"><a class="logo" href="index.html"><span class="coin">V</span>ViewFaucet</a><nav><a class="btn alt" href="index.html">Home</a></nav></header>
<div class="auth"><div class="auth-box"><h1>Create your account</h1><p class="sub">Free, and ready in a minute.</p><p id="refNote" class="note" style="margin:0 0 4px;display:none"></p><script>document.addEventListener("DOMContentLoaded",()=>{const n=document.getElementById("refNote");new MutationObserver(()=>n.style.display=n.textContent?"block":"none").observe(n,{childList:true})})</script><form id="form"><label for="username">Username</label><input id="username" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="Choose a username" autocomplete="username" required><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><button class="btn wide" type="submit">Create account</button><p id="m" class="msg" role="status"></p></form><div class="auth-links"><span></span><a href="login.html">I have an account</a></div></div></div><div id="toast" class="toast"></div><footer class="site-footer"><span>ViewFaucet</span><span>© <span class="current-year"></span> ViewFaucet</span></footer></body></html>
